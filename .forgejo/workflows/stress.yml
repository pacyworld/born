name: Stress
# #45 repro shape: 500 suite runs under induced CPU load, weekly. A failure is
# a release blocker. This workflow is schedule/dispatch only, so it never gates
# a push or pull request; ci.yml carries the per-commit gates. The workload is
# bounded (HOGS busy-loops, one suite process at a time) and runs off-peak to
# avoid contending with other runner jobs.
on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Suite runs per platform'
        required: false
        default: '500'
      hogs:
        description: 'CPU busy-loops beside the suite'
        required: false
        default: '4'

env:
  RUNS: ${{ github.event.inputs.runs || '500' }}
  HOGS: ${{ github.event.inputs.hogs || '4' }}
