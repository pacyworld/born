jobs:
  # runner01 builds both test executables (native FreeBSD and cross Linux) at
  # ReleaseSafe with Zig 0.15.2 and stages bench/stress.sh beside each so the
  # runtime jobs need no checkout. The stress gate pins one toolchain: it
  # exercises runtime scheduling, not toolchain codegen (ci.yml owns the
  # tri-toolchain matrix).
  build:
    name: Build stress executables (runner01, zig 0.15.2)
    runs-on: FreeBSD
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision Zig 0.15.2 (pinned sha256, cached)
        run: |
          set -eu
          ver=0.15.2
          cache="$HOME/.cache/born-zig/$ver"
          if [ ! -x "$cache/zig" ]; then
            mkdir -p "$cache"
            url="https://ziglang.org/download/$ver/zig-x86_64-freebsd-$ver.tar.xz"
            echo "Downloading $url"
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL --retry 3 "$url" -o "$cache/zig.tar.xz"
            else
              fetch -o "$cache/zig.tar.xz" "$url"
            fi
            echo "$ZIG_0152_SHA256  $cache/zig.tar.xz" | sha256sum -c -
            tar -xf "$cache/zig.tar.xz" -C "$cache" --strip-components=1
            rm -f "$cache/zig.tar.xz"
          fi
          test "$("$cache/zig" version)" = "$ver"
          echo "ZIG=$cache/zig" >> "$GITHUB_ENV"
          echo "host: $(uname -srm), commit $GITHUB_SHA, zig $ver"

      - name: Build native FreeBSD and cross Linux test executables
        run: |
          set -eu
          "$ZIG" build test-bin -Doptimize=ReleaseSafe --prefix zig-out/freebsd --summary all
          "$ZIG" build test-bin -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe --prefix zig-out/linux --summary all
          mkdir -p stage-freebsd stage-linux
          cp zig-out/freebsd/bin/born-tests stage-freebsd/born-tests
          ( cd zig-out/freebsd/bin && sha256sum born-tests ) > stage-freebsd/born-tests.sha256
          cp bench/stress.sh stage-freebsd/stress.sh
          cp zig-out/linux/bin/born-tests stage-linux/born-tests
          ( cd zig-out/linux/bin && sha256sum born-tests ) > stage-linux/born-tests.sha256
          cp bench/stress.sh stage-linux/stress.sh

      - name: Upload FreeBSD stress bundle
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: born-stress-freebsd
          path: stage-freebsd/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux stress bundle
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: born-stress-linux
          path: stage-linux/
          if-no-files-found: error
          retention-days: 14

  # runner01 (FreeBSD, kqueue): the listener exhaustion-resume race and the
  # timer cases run here. runner01 trusts the Pacy World root, so no CA step.
  stress-freebsd:
    name: Stress FreeBSD (runner01, kqueue)
    runs-on: FreeBSD
    needs: build
    timeout-minutes: 150
    steps:
      - name: Download FreeBSD stress bundle
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: born-stress-freebsd
          path: born-stress

      - name: Run stress gate
        run: |
          set -eu
          cd born-stress
          sha256sum -c born-tests.sha256
          chmod +x born-tests
          echo "host: $(uname -srm), commit $GITHUB_SHA, runs=$RUNS hogs=$HOGS"
          sh stress.sh ./born-tests "$RUNS" "$HOGS"
          echo "stress evidence (x86_64-freebsd, kqueue, zig 0.15.2, ReleaseSafe): runs=$RUNS hogs=$HOGS failed=0"

  # runner03 (Ubuntu 24.04, epoll): the same cases on Linux. The container has
  # no Zig and no checkout; the bundle carries stress.sh. Node needs the root.
  stress-linux:
    name: Stress Linux (runner03, epoll)
    runs-on: ubuntu-24.04
    container: node:24-bookworm
    needs: build
    timeout-minutes: 150
    steps:
      - name: Trust the Pacy World Root CA for Node
        run: |
          pem="$RUNNER_TEMP/pacyworld-root.pem"
          printf '%s' "$PACYWORLD_ROOT_CA" > "$pem"
          node -e 'const c = new (require("crypto").X509Certificate)(require("fs").readFileSync(process.argv[1])); if (c.fingerprint256 !== process.argv[2]) { console.error("root CA fingerprint mismatch: " + c.fingerprint256); process.exit(1); }' "$pem" "$PACYWORLD_ROOT_CA_SHA256"
          echo "NODE_EXTRA_CA_CERTS=$pem" >> "$GITHUB_ENV"

      - name: Download Linux stress bundle
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: born-stress-linux
          path: born-stress

      - name: Run stress gate
        run: |
          set -eu
          cd born-stress
          sha256sum -c born-tests.sha256
          chmod +x born-tests
          echo "host: $(uname -srm), $(. /etc/os-release && echo "$PRETTY_NAME") container, commit $GITHUB_SHA, runs=$RUNS hogs=$HOGS"
          sh stress.sh ./born-tests "$RUNS" "$HOGS"
          echo "stress evidence (x86_64-linux-gnu, epoll, zig 0.15.2, ReleaseSafe): runs=$RUNS hogs=$HOGS failed=0"