  # Official ziglang.org x86_64-freebsd tarball SHA-256 pins (download
  # index.json). runner01 does all building, so only FreeBSD tarballs are
  # provisioned; runner02/runner03 only run the cross-built executables.
  ZIG_0152_SHA256: 5509ff57cd3f219165caed0da10221739af82742b9edfcda3f7bfaf4da7212dd
  ZIG_0160_SHA256: 390379bfaf6b89b001c6bb4035b8fcbc5c12193fd9fd5048c3a0fe39e5d1cf72
  ZIG_0171_SHA256: fd8b9728f05db2a9942fc1f18087c0e0d6dfccb7a51557b06cf026d3e4c78542

jobs:
  # Exactly one formatting gate, pinned to Zig 0.15.2. The 0.17.1 formatter
  # rewrites @intFromEnum/@enumFromInt to builtins unavailable in 0.15.2, so
  # there is deliberately no fmt matrix (AGENTS.md). This job also carries the
  # README/AGENTS consistency check; build.zig's embedded README target-table
  # guard runs in every build leg below.
  fmt:
    name: Formatting + consistency (runner01, 0.15.2)
    runs-on: FreeBSD
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Zig 0.15.2
        run: |
          echo "host: $(uname -srm), commit $GITHUB_SHA"
          zig version
          test "$(zig version)" = "0.15.2"

      - name: Format check (0.15.2 only)
        run: zig fmt --check .

      - name: README/AGENTS consistency
        run: |
          set -eu
          for v in 0.15.2 0.16.0 0.17.1; do
            grep -q "$v" README.md
            grep -q "$v" AGENTS.md
          done
          grep -q 'zig016' AGENTS.md
          grep -q 'zig0171' AGENTS.md
          for t in x86_64-freebsd x86_64-linux-gnu aarch64-macos x86_64-macos x86_64-windows-gnu x86_64-netbsd x86_64-openbsd; do
            grep -q "$t" README.md
          done
          echo "README/AGENTS consistency: OK"

  # runner01 (FreeBSD): one leg per toolchain. Each leg runs the native kqueue
  # suite (Debug and ReleaseSafe), the seven-target compile gate, the API doc
  # build, and cross-builds the Linux and Windows test executables (Debug and
  # ReleaseSafe) for the runtime jobs below. max-parallel keeps the legs
  # sequential on the shared host so they do not contend for CPU or loopback.
  build:
    name: FreeBSD tests + cross-builds (runner01, zig ${{ matrix.zig }})
    runs-on: FreeBSD
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      matrix:
        zig: [0.15.2, 0.16.0, 0.17.1]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision Zig ${{ matrix.zig }} (pinned sha256, cached)
        run: |
          set -eu
          ver="${{ matrix.zig }}"
          case "$ver" in
            0.15.2) sha="$ZIG_0152_SHA256" ;;
            0.16.0) sha="$ZIG_0160_SHA256" ;;
            0.17.1) sha="$ZIG_0171_SHA256" ;;
            *) echo "unknown toolchain $ver"; exit 1 ;;
          esac
          cache="$HOME/.cache/born-zig/$ver"
          if [ ! -x "$cache/zig" ]; then
            mkdir -p "$cache"
            url="https://ziglang.org/download/$ver/zig-x86_64-freebsd-$ver.tar.xz"
            echo "Downloading $url"
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL --retry 3 "$url" -o "$cache/zig.tar.xz"
            else
              fetch -o "$cache/zig.tar.xz" "$url"
            fi
            echo "$sha  $cache/zig.tar.xz" | sha256sum -c -
            tar -xf "$cache/zig.tar.xz" -C "$cache" --strip-components=1
            rm -f "$cache/zig.tar.xz"
          fi
          test "$("$cache/zig" version)" = "$ver"
          echo "ZIG=$cache/zig" >> "$GITHUB_ENV"
          echo "host: $(uname -srm), commit $GITHUB_SHA, zig $ver"
          "$cache/zig" version

      # zig build test decides pass/fail by its exit code (set -e aborts on a
      # nonzero run). The native --summary all output is a "Build Summary:"
      # line, not the standalone runner's "All N tests passed." line, so the
      # evidence line quotes the build summary verbatim.
      - name: Unit tests (native Debug)
        run: |
          set -eu
          "$ZIG" build test -Doptimize=Debug --summary all > freebsd-debug.log 2>&1
          cat freebsd-debug.log
          summary=$(grep -E 'Build Summary:.*tests passed' freebsd-debug.log) || { echo "born-tests printed no passing build summary"; exit 1; }
          echo "runtime evidence (x86_64-freebsd, kqueue, zig ${{ matrix.zig }}, Debug): $summary"

      - name: Unit tests (native ReleaseSafe)
        run: |
          set -eu
          "$ZIG" build test -Doptimize=ReleaseSafe --summary all > freebsd-releasesafe.log 2>&1
          cat freebsd-releasesafe.log
          summary=$(grep -E 'Build Summary:.*tests passed' freebsd-releasesafe.log) || { echo "born-tests printed no passing build summary"; exit 1; }
          echo "runtime evidence (x86_64-freebsd, kqueue, zig ${{ matrix.zig }}, ReleaseSafe): $summary"

      - name: Compile tests for all seven supported targets
        run: |
          "$ZIG" build check-targets --summary all

      - name: Generate API documentation
        run: |
          "$ZIG" build docs --summary all
          test -f zig-out/docs/index.html

      - name: Cross-build Linux and Windows test executables (Debug + ReleaseSafe)
        run: |
          set -eu
          for opt in Debug ReleaseSafe; do
            "$ZIG" build test-bin -Dtarget=x86_64-linux-gnu -Doptimize="$opt" --prefix "zig-out/linux-$opt" --summary all
            ( cd "zig-out/linux-$opt/bin" && sha256sum born-tests | tee born-tests.sha256 )
            "$ZIG" build test-bin -Dtarget=x86_64-windows-gnu -Doptimize="$opt" --prefix "zig-out/windows-$opt" --summary all
            ( cd "zig-out/windows-$opt/bin" && sha256sum born-tests.exe | tee born-tests.exe.sha256 )
          done

      - name: Upload Linux test executable (Debug)
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: born-tests-${{ matrix.zig }}-x86_64-linux-gnu-Debug
          path: |
            zig-out/linux-Debug/bin/born-tests
            zig-out/linux-Debug/bin/born-tests.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux test executable (ReleaseSafe)
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: born-tests-${{ matrix.zig }}-x86_64-linux-gnu-ReleaseSafe
          path: |
            zig-out/linux-ReleaseSafe/bin/born-tests
            zig-out/linux-ReleaseSafe/bin/born-tests.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows test executable (Debug)
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: born-tests-${{ matrix.zig }}-x86_64-windows-gnu-Debug
          path: |
            zig-out/windows-Debug/bin/born-tests.exe
            zig-out/windows-Debug/bin/born-tests.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows test executable (ReleaseSafe)
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: born-tests-${{ matrix.zig }}-x86_64-windows-gnu-ReleaseSafe
          path: |
            zig-out/windows-ReleaseSafe/bin/born-tests.exe
            zig-out/windows-ReleaseSafe/bin/born-tests.exe.sha256
          if-no-files-found: error
          retention-days: 14

  # runner03 (Ubuntu 24.04): epoll runtime tests, one leg per toolchain and
  # optimize mode. The job container shares the runner's kernel, so the
  # syscalls under test are real Linux ones. No Zig is needed here.
  linux-runtime:
    name: Linux runtime (runner03, zig ${{ matrix.zig }}, ${{ matrix.optimize }})
    runs-on: ubuntu-24.04
    container: node:24-bookworm
    needs: build
    timeout-minutes: 15
    strategy:
      matrix:
        zig: [0.15.2, 0.16.0, 0.17.1]
        optimize: [Debug, ReleaseSafe]
    steps:
      - name: Trust the Pacy World Root CA for Node
        run: |
          pem="$RUNNER_TEMP/pacyworld-root.pem"
          printf '%s' "$PACYWORLD_ROOT_CA" > "$pem"
          node -e 'const c = new (require("crypto").X509Certificate)(require("fs").readFileSync(process.argv[1])); if (c.fingerprint256 !== process.argv[2]) { console.error("root CA fingerprint mismatch: " + c.fingerprint256); process.exit(1); }' "$pem" "$PACYWORLD_ROOT_CA_SHA256"
          echo "NODE_EXTRA_CA_CERTS=$pem" >> "$GITHUB_ENV"

      - name: Download Linux test executable
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: born-tests-${{ matrix.zig }}-x86_64-linux-gnu-${{ matrix.optimize }}
          path: born-tests

      - name: Run born-tests
        run: |
          cd born-tests
          sha256sum -c born-tests.sha256
          chmod +x born-tests
          echo "host: $(uname -srm), $(. /etc/os-release && echo "$PRETTY_NAME") container, commit $GITHUB_SHA, zig ${{ matrix.zig }} ${{ matrix.optimize }}"
          ./born-tests 2>&1 | tee born-tests.log
          summary=$(grep -E '^(All [0-9]+ tests passed\.|[0-9]+ passed; [0-9]+ skipped; 0 failed\.)$' born-tests.log) || { echo "born-tests printed no passing summary line"; exit 1; }
          echo "runtime evidence (x86_64-linux-gnu, epoll, zig ${{ matrix.zig }}, ${{ matrix.optimize }}): $summary"

  # runner02 (Windows Server 2022, host mode): IOCP runtime tests, one leg per
  # toolchain and optimize mode. No Zig is needed here.
  windows-runtime:
    name: Windows runtime (runner02, zig ${{ matrix.zig }}, ${{ matrix.optimize }})
    runs-on: windows-2022
    needs: build
    timeout-minutes: 15
    strategy:
      matrix:
        zig: [0.15.2, 0.16.0, 0.17.1]
        optimize: [Debug, ReleaseSafe]
    steps:
      - name: Trust the Pacy World Root CA for Node
        run: |
          $pem = Join-Path $env:RUNNER_TEMP 'pacyworld-root.pem'
          Set-Content -Path $pem -Value $env:PACYWORLD_ROOT_CA -Encoding ascii -NoNewline
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 -ArgumentList $pem
          $digest = [System.Security.Cryptography.SHA256]::Create().ComputeHash($cert.RawData)
          $fingerprint = ($digest | ForEach-Object { $_.ToString('X2') }) -join ':'
          if ($fingerprint -ne $env:PACYWORLD_ROOT_CA_SHA256) { throw "root CA fingerprint mismatch: $fingerprint" }
          Add-Content -Path $env:GITHUB_ENV -Value "NODE_EXTRA_CA_CERTS=$pem" -Encoding ascii

      - name: Download Windows test executable
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: born-tests-${{ matrix.zig }}-x86_64-windows-gnu-${{ matrix.optimize }}
          path: born-tests

      - name: Run born-tests.exe
        run: |
          cd born-tests
          $expected = (Get-Content born-tests.exe.sha256 -Raw).Split(' ')[0].Trim().ToUpperInvariant()
          $actual = (Get-FileHash born-tests.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "born-tests.exe sha256 $actual does not match the build ($expected)" }
          "born-tests.exe: OK ($actual)"
          "host: $([System.Environment]::OSVersion.VersionString), commit $env:GITHUB_SHA, zig ${{ matrix.zig }} ${{ matrix.optimize }}"
          # cmd redirection keeps the test runner's stderr out of PowerShell's error stream.
          cmd /c "born-tests.exe > born-tests.log 2>&1"
          $rc = $LASTEXITCODE
          Get-Content born-tests.log
          if ($rc -ne 0) { throw "born-tests.exe exited with $rc" }
          $summary = Select-String -Path born-tests.log -Pattern '^(All [0-9]+ tests passed\.|[0-9]+ passed; [0-9]+ skipped; 0 failed\.)$'
          if (-not $summary) { throw "born-tests.exe printed no passing summary line" }
          "runtime evidence (x86_64-windows-gnu, IOCP, zig ${{ matrix.zig }}, ${{ matrix.optimize }}): $($summary.Line)"