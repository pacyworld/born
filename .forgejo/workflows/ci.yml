jobs:
  # runner01 (FreeBSD): kqueue runtime tests, the seven-target compile gate,
  # and the Linux and Windows test executables for the runtime jobs below.
  build:
    name: FreeBSD tests and cross-builds (runner01)
    runs-on: FreeBSD
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Zig 0.15.2
        run: |
          zig version
          test "$(zig version)" = "0.15.2"

      - name: Unit tests (native Debug)
        run: zig build test -Doptimize=Debug --summary all

      - name: Unit tests (native ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: Compile tests for all seven supported targets
        run: zig build check-targets --summary all

      - name: Build Linux runtime test executable
        run: |
          zig build test-bin -Dtarget=x86_64-linux-gnu -Doptimize=ReleaseSafe --prefix zig-out/linux --summary all
          cd zig-out/linux/bin && sha256sum born-tests | tee born-tests.sha256

      - name: Build Windows runtime test executable
        run: |
          zig build test-bin -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe --prefix zig-out/windows --summary all
          cd zig-out/windows/bin && sha256sum born-tests.exe | tee born-tests.exe.sha256

      - name: Upload Linux test executable
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: born-tests-x86_64-linux-gnu
          path: |
            zig-out/linux/bin/born-tests
            zig-out/linux/bin/born-tests.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows test executable
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: born-tests-x86_64-windows-gnu
          path: |
            zig-out/windows/bin/born-tests.exe
            zig-out/windows/bin/born-tests.exe.sha256
          if-no-files-found: error
          retention-days: 14

  # runner03 (Ubuntu 24.04): epoll runtime tests. The job container shares
  # the runner's kernel, so the syscalls under test are real Linux ones.
  linux-runtime:
    name: Linux runtime tests (runner03, ubuntu-24.04)
    runs-on: ubuntu-24.04
    container: node:24-bookworm
    needs: build
    timeout-minutes: 15
    steps:
      - name: Trust the Pacy World Root CA for Node
        run: |
          pem="$RUNNER_TEMP/pacyworld-root.pem"
          printf '%s' "$PACYWORLD_ROOT_CA" > "$pem"
          node -e 'const c = new (require("crypto").X509Certificate)(require("fs").readFileSync(process.argv[1])); if (c.fingerprint256 !== process.argv[2]) { console.error("root CA fingerprint mismatch: " + c.fingerprint256); process.exit(1); }' "$pem" "$PACYWORLD_ROOT_CA_SHA256"
          echo "NODE_EXTRA_CA_CERTS=$pem" >> "$GITHUB_ENV"

      - name: Download Linux test executable
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: born-tests-x86_64-linux-gnu
          path: born-tests

      - name: Run born-tests
        run: |
          cd born-tests
          sha256sum -c born-tests.sha256
          chmod +x born-tests
          echo "host: $(uname -srm), $(. /etc/os-release && echo "$PRETTY_NAME") container, commit $GITHUB_SHA"
          ./born-tests 2>&1 | tee born-tests.log
          summary=$(grep -E '^(All [0-9]+ tests passed\.|[0-9]+ passed; [0-9]+ skipped; 0 failed\.)$' born-tests.log) || { echo "born-tests printed no passing summary line"; exit 1; }
          echo "runtime evidence (x86_64-linux-gnu, epoll): $summary"

  # runner02 (Windows Server 2022, host mode): IOCP runtime tests.
  windows-runtime:
    name: Windows runtime tests (runner02, windows-2022)
    runs-on: windows-2022
    needs: build
    timeout-minutes: 15
    steps:
      - name: Trust the Pacy World Root CA for Node
        run: |
          $pem = Join-Path $env:RUNNER_TEMP 'pacyworld-root.pem'
          Set-Content -Path $pem -Value $env:PACYWORLD_ROOT_CA -Encoding ascii -NoNewline
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 -ArgumentList $pem
          $digest = [System.Security.Cryptography.SHA256]::Create().ComputeHash($cert.RawData)
          $fingerprint = ($digest | ForEach-Object { $_.ToString('X2') }) -join ':'
          if ($fingerprint -ne $env:PACYWORLD_ROOT_CA_SHA256) { throw "root CA fingerprint mismatch: $fingerprint" }
          Add-Content -Path $env:GITHUB_ENV -Value "NODE_EXTRA_CA_CERTS=$pem" -Encoding ascii

      - name: Download Windows test executable
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: born-tests-x86_64-windows-gnu
          path: born-tests

      - name: Run born-tests.exe
        run: |
          cd born-tests
          $expected = (Get-Content born-tests.exe.sha256 -Raw).Split(' ')[0].Trim().ToUpperInvariant()
          $actual = (Get-FileHash born-tests.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "born-tests.exe sha256 $actual does not match the build ($expected)" }
          "born-tests.exe: OK ($actual)"
          "host: $([System.Environment]::OSVersion.VersionString), commit $env:GITHUB_SHA"
          # cmd redirection keeps the test runner's stderr out of PowerShell's error stream.
          cmd /c "born-tests.exe > born-tests.log 2>&1"
          $rc = $LASTEXITCODE
          Get-Content born-tests.log
          if ($rc -ne 0) { throw "born-tests.exe exited with $rc" }
          $summary = Select-String -Path born-tests.log -Pattern '^(All [0-9]+ tests passed\.|[0-9]+ passed; [0-9]+ skipped; 0 failed\.)$'
          if (-not $summary) { throw "born-tests.exe printed no passing summary line" }
          "runtime evidence (x86_64-windows-gnu, IOCP): $($summary.Line)"
