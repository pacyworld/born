name: Consumers
on:
  push:
  pull_request:
  schedule:
    - cron: '0 8 * * 0'
  # Release gate: devin dispatches this workflow at the cut commit; the
  # suite jobs are the tri-kernel consumer evidence for the tag. Stress and
  # bench stay schedule/dispatch only and never gate a push; this dispatch
  # is the one that does.
  workflow_dispatch:

